<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEW_BUS_TIME</title>
    <meta name="theme-color" content="#1a73e8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128652;</text></svg>">
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --green-bg: #c8f7c5;
            --green-header: #2e7d32;
            --green-btn: #43a047;
            --red-bg: #fdd;
            --red-header: #c62828;
            --red-btn: #e53935;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 14px 16px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(26,115,232,0.3);
        }
        .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 3px; }
        .header-sub { font-size: 12px; opacity: 0.9; }

        .stop-buttons {
            background: white;
            padding: 6px 10px 4px;
            border-bottom: 1px solid #e5e7eb;
        }
        .btn-section-label {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 5px;
            padding-right: 4px;
        }
        .btn-section-label.lbl-base { color: var(--green-header); }
        .btn-section-label.lbl-home { color: var(--red-header); }
        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 4px;
        }
        .btn-grid:last-child { margin-bottom: 0; }
        .stop-btn {
            border: none;
            border-radius: 8px;
            padding: 6px 6px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            color: white;
            flex: 1;
            min-width: 0;
            white-space: normal;
            line-height: 1.25;
            max-height: 50px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
        }
        .stop-btn-num {
            position: absolute;
            top: 2px;
            right: 3px;
            font-size: 8px;
            font-weight: 900;
            opacity: 0.75;
            line-height: 1;
        }
        .stop-btn:active { transform: scale(0.96); }
        .stop-btn.btn-base { background: var(--green-btn); }
        .stop-btn.btn-home { background: var(--red-btn); }
        .stop-btn.active { box-shadow: 0 0 0 3px rgba(0,0,0,0.3); transform: scale(1.03); }

        .stop-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            max-width: 900px;
            margin: 12px auto;
            display: none;
        }
        .stop-card.dir-base { border-right: 5px solid var(--green-header); }
        .stop-card.dir-home { border-right: 5px solid var(--red-header); }

        .stop-header {
            padding: 12px 14px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stop-header.bg-green { background: var(--green-bg); }
        .stop-header.bg-red { background: var(--red-bg); }
        .stop-name { font-size: 16px; font-weight: 700; }
        .stop-desc { font-size: 12px; color: var(--text-muted); }
        .stop-card.dir-extra { border-right: 5px solid var(--primary); }
        .stop-header.bg-blue { background: #e3f2fd; }
        .btn-section-label.lbl-extra { color: #0081cb; }
        .stop-btn.btn-extra { background: #00b0ff; flex: 0 0 48%; }
        .stop-btn.btn-orange { background: #ff9800; flex: 0 0 48%; }
        .site-link {
            font-size: 12px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .site-link:hover { text-decoration: underline; }
        .stop-img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid #e5e7eb;
        }
        .site-frame {
            width: 100%;
            height: 70vh;
            min-height: 400px;
            border: none;
            display: block;
        }
        .scroll-hint {
            text-align: center;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            background: #e3f2fd;
            border-bottom: 1px solid #e5e7eb;
        }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-muted);
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div style="background:#333;text-align:center;padding:4px 0;display:flex;justify-content:center;align-items:center;gap:10px">
        <span style="color:#f9a825;font-weight:800;font-size:11px;">נכתב על ידי רובי דביר roobid@gmail.com</span>
    </div>
    <header class="header">
        <h1>&#128652; NEW BUS TIME</h1>
        <div class="header-sub">בחרו תחנה כדי לצפות באתר busnearby</div>
    </header>

    <div class="stop-buttons">
        <div class="btn-grid" id="baseGrid"></div>
        <div class="btn-grid" id="homeGrid"></div>
        <div class="btn-grid" id="extraGrid"></div>
        <div class="btn-grid" id="moreGrid"></div>
    </div>

    <div class="stop-card" id="stopCard">
        <div class="stop-header" id="stopHeader">
            <div class="stop-name" id="stopName"></div>
            <div class="stop-desc" id="stopDesc"></div>
            <a id="stopLink" href="#" target="_blank" class="site-link">פתח בכרטיסייה חדשה</a>
        </div>
        <img id="stopImg" class="stop-img" src="" alt="" onerror="this.style.display='none'">
        <div class="scroll-hint">גלול עם האצבע רשימת אוטובוסים</div>
        <iframe id="siteFrame" class="site-frame" src="about:blank"></iframe>
    </div>

    <div class="empty-state" id="emptyState">בחרו תחנה מהכפתורים למעלה</div>

    <script>
        const STOPS = [
            { code: '37018', name: 'מהשכונה טשרנחובסקי ויצמן', desc: 'ממש ליד השכרת רכב בשכונה', dir: 'base', img: '37018.jpg', url: 'https://busnearby.co.il/stop/1:24394' },
            { code: '22942', name: 'מחלף גבעת שמואל/כביש 4', desc: 'ממש ליד מפעל קוקה קולה', dir: 'base', img: '22942.jpg', url: 'https://busnearby.co.il/stop/1:13274' },
            { code: '33737', name: 'צומת בית דגן', desc: 'מפה ישירות לבסיס', dir: 'base', img: '33737.jpg', url: 'https://busnearby.co.il/stop/1:21799' },
            { code: '32465', name: 'מליד העבודה של אבא', desc: 'ישיר עד הבסיס', dir: 'base', img: '32465.jpg', url: 'https://busnearby.co.il/stop/1:16390' },
            { code: '33442', name: 'מהבסיס תחנה שחורה', desc: 'האחרים לצומת בית דגן', dir: 'home', img: '33442.jpg', url: 'https://busnearby.co.il/stop/1:21596' },
            { code: '33440', name: 'צומת בית דגן', desc: 'נוסעים לגבעת שמואל תחנה', dir: 'home', img: '33440.jpg', url: 'https://busnearby.co.il/stop/1:21595' },
            { code: '21257', name: 'אחרי גשר גב. שמואל', desc: 'קווים ישירים לכפר סבא', dir: 'home', img: '21257.jpg', url: 'https://busnearby.co.il/stop/1:12962' },
            { code: '38243', name: 'ליד עבודה אבא לבית', desc: 'שים לב 42 מגיע רק לקניון ערים', dir: 'home', img: '38243.jpg', url: 'https://busnearby.co.il/stop/1:25206' },
            { code: '27063', name: 'צומת גהה הביתה', desc: 'מחלף גהה/דרך ז\'בוטינסקי — בני ברק', dir: 'home', img: '27063.jpg', url: 'https://busnearby.co.il/stop/1:14348' }
        ];

        const EXTRAS = [
            { code: '20349', name: '20349 סבידור/נמיר', desc: '', dir: 'extra', img: '', url: 'https://busnearby.co.il/stop/1:29480' },
            { code: '21644', name: '21644 אבא  הלל/זבוט', desc: '', dir: 'extra', img: '', url: 'https://busnearby.co.il/stop/1:13198' }
        ];

        const MORE = [
            { code: 'bsh', name: 'ב"ש מרכז', desc: '', dir: 'extra', img: '', url: 'https://busnearby.co.il/stop/1:26652' },
            { code: 'bdim', name: 'בהדים', desc: '', dir: 'extra', img: '', url: 'https://busnearby.co.il/stop/1:38736' }
        ];

        let btnNum = 1;

        function esc(t) {
            const div = document.createElement('div');
            div.textContent = t;
            return div.innerHTML;
        }

        function renderButtons() {
            const baseGrid = document.getElementById('baseGrid');
            const homeGrid = document.getElementById('homeGrid');
            STOPS.forEach((s) => {
                const btn = document.createElement('button');
                btn.className = 'stop-btn ' + (s.dir === 'base' ? 'btn-base' : 'btn-home');
                btn.innerHTML = '<span class="stop-btn-num">' + (btnNum++) + '</span>' + esc(s.name);
                btn.onclick = () => selectStop(s, btn);
                (s.dir === 'base' ? baseGrid : homeGrid).appendChild(btn);
            });
        }

        function renderExtras() {
            const extraGrid = document.getElementById('extraGrid');
            EXTRAS.forEach((s) => {
                const btn = document.createElement('button');
                btn.className = 'stop-btn btn-extra';
                btn.innerHTML = '<span class="stop-btn-num">' + (btnNum++) + '</span>' + esc(s.name);
                btn.onclick = () => selectStop(s, btn);
                extraGrid.appendChild(btn);
            });
        }

        function renderMore() {
            const moreGrid = document.getElementById('moreGrid');
            MORE.forEach((s) => {
                const btn = document.createElement('button');
                btn.className = 'stop-btn btn-orange';
                btn.innerHTML = '<span class="stop-btn-num">' + (btnNum++) + '</span>' + esc(s.name);
                btn.onclick = () => selectStop(s, btn);
                moreGrid.appendChild(btn);
            });
        }

        function selectStop(s, btn) {
            document.querySelectorAll('.stop-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const card = document.getElementById('stopCard');
            const header = document.getElementById('stopHeader');

            let cardClass, headerClass;
            if (s.dir === 'base') { cardClass = 'dir-base'; headerClass = 'bg-green'; }
            else if (s.dir === 'home') { cardClass = 'dir-home'; headerClass = 'bg-red'; }
            else { cardClass = 'dir-extra'; headerClass = 'bg-blue'; }

            card.className = 'stop-card ' + cardClass;
            header.className = 'stop-header ' + headerClass;

            document.getElementById('stopName').textContent = s.name;
            document.getElementById('stopDesc').textContent = s.desc;
            document.getElementById('stopLink').href = s.url;

            const img = document.getElementById('stopImg');
            if (s.img) {
                img.style.display = '';
                img.src = 'images/' + s.img;
                img.alt = s.name;
            } else {
                img.style.display = 'none';
                img.src = '';
            }

            document.getElementById('siteFrame').src = s.url;

            document.getElementById('emptyState').style.display = 'none';
            card.style.display = 'block';
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        renderButtons();
        renderExtras();
        renderMore();
    </script>
</body>
</html>
